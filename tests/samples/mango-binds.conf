# Sample bind.conf for the tests. Covers every line shape that occurs in a real
# mango configuration, plus the broken shapes a typo produces. The counts are
# hard-coded in test_sources.cpp, so do not insert anything without adjusting
# the test.

# --- Programs ---
bind=SUPER,t,spawn,ghostty
bind=SUPER+CTRL,t,spawn,kitty
bind=SUPER,e,spawn,ghostty -e yazi

# --- Windows ---
bind=SUPER,v,togglefloating,
bind=SUPER+CTRL,d,dwindle_toggle_split_direction
bind=SUPER,q,killclient,
# An ordinary note. It contains bind=SUPER,x,spawn,nothing and must still not
# produce an entry, because the line starts with #.

# --- Focus ---
bind=SUPER,Left,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER+ALT,h,setlayout,scroller

# --- Tags ---
bind=SUPER,1,view,1,0
bind=SUPER+SHIFT,9,tag,9,0

# --- Broken lines: none of these may produce an entry ---
bind=
bind=SUPER
bind=SUPER,,spawn,nothing
bind=SUPER,x,

# --- Edge cases that are valid ---
bind=,F5,reload_config
bind=SUPER,slash,spawn,bindpeek

# --- Not keyboard shortcuts ---
mousebind=SUPER,btn_left,moveresize,curmove
axisbind=SUPER,UP,viewtoleft_have_client
